AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ChallanCheck. API Gateway HTTP API -> one Lambda that serves both the built web
  app and the JSON API (/api/*) -> Amazon Rekognition (DetectLabels). Same origin,
  so no CORS. Stateless: no database, queue or bucket at runtime. Credentials are
  the function's IAM role only; no access keys exist anywhere.

Parameters:
  CodeBucket:
    Type: String
    Description: Private bucket holding the function zip (created by infra/deploy.sh).
  CodeKey:
    Type: String
    Description: Object key of the function zip (content-addressed by infra/deploy.sh).
  ApiThrottleRateLimit:
    Type: Number
    Default: 3
    Description: >-
      Sustained requests/second on EACH route that can reach Rekognition (POST /api/* and
      POST /audit; each is throttled separately) and so spend money. Abuse and cost guard.
  ApiThrottleBurstLimit:
    Type: Number
    Default: 6
    Description: Short-burst ceiling on POST /api/*.
  SiteThrottleRateLimit:
    Type: Number
    Default: 50
    Description: >-
      Sustained requests/second for everything else (static files, /api/health).
      Higher, because one page view loads several files at once; none of it
      reaches Rekognition.
  SiteThrottleBurstLimit:
    Type: Number
    Default: 100
  LogRetentionDays:
    Type: Number
    Default: 14

Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: !Ref LogRetentionDays

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DetectLabels is the only Rekognition action the function calls: no
              # rekognition:*, no RekognitionFullAccess. The API has no resource-level
              # permissions, so Resource must be "*"; the single action and the region
              # condition are what keep it tight. The role grants no other AWS service.
              - Sid: DetectLabelsOnly
                Effect: Allow
                Action: rekognition:DetectLabels
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: WriteOwnLogsOnly
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ApiLogGroup.Arn

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: ChallanCheck web app + Amazon Rekognition observation relay (the rule engine runs in the browser)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: backend/lambda.handler
      MemorySize: 512
      # API Gateway HTTP API cuts integrations off at 30 s; stay under it so the
      # client gets our coded error instead of a bare gateway 504.
      Timeout: 28
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  # Two routes, one function. POST /api/* can reach Rekognition, so it gets its own,
  # tight throttle. Everything else (the web app's static files, /api/health)
  # falls to $default. The function owns routing and 404/405, so the same code
  # behaves identically locally and deployed.
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/{proxy+}"
      Target: !Sub integrations/${Integration}

  # The frontend contract is POST ${VITE_API_BASE_URL}/audit and GET /health (as on the
  # local server). This route makes POST /audit work at the API root, with the SAME tight
  # throttle: never through the looser $default route.
  AuditRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /audit"
      Target: !Sub integrations/${Integration}

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub integrations/${Integration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [ApiRoute, AuditRootRoute, DefaultRoute]
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref SiteThrottleRateLimit
        ThrottlingBurstLimit: !Ref SiteThrottleBurstLimit
      RouteSettings:
        "POST /api/{proxy+}":
          ThrottlingRateLimit: !Ref ApiThrottleRateLimit
          ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
        "POST /audit":
          ThrottlingRateLimit: !Ref ApiThrottleRateLimit
          ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

Outputs:
  SiteUrl:
    Description: Public URL of the web app. The API is the same origin under /api.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FunctionName:
    Value: !Ref ApiFunction
  LogGroupName:
    Value: !Ref ApiLogGroup
