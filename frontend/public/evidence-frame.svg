<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="1200" height="900" fill="none">
  <!--
    Schematic evidence frame. NOT a photograph: a privacy-safe drawing of the regions that
    Amazon Rekognition DetectLabels reported for one recorded test run (car, driver, licence
    plate, and a vehicle at the left edge), placed at the reported bounding boxes. No real
    person, face or registration number appears here; the plate is a hatched placeholder.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#e4e8ef"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dde2ea"/>
      <stop offset="1" stop-color="#cfd5df"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#d9dfe8"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" stroke="#c9d0dc" stroke-width="0.5" opacity="0.55"/>
    </pattern>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#f6f7f9"/>
      <path d="M0 0V5" stroke="#8d97a8" stroke-width="1.6"/>
    </pattern>
  </defs>

  <!-- ground plane + sky -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <rect y="112" width="400" height="188" fill="url(#road)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <path d="M0 112H400" stroke="#b8c0ce" stroke-width="1"/>
  <!-- lane geometry converging on the horizon -->
  <path d="M200 112L-40 300M200 112L440 300M200 112L120 300M200 112L280 300" stroke="#c3cad6" stroke-width="1"/>

  <!-- vehicle at the left edge (labelled "Motorcycle" by Rekognition) -->
  <g>
    <rect x="-6" y="76" width="50" height="30" rx="8" fill="#c9cfd9" stroke="#a6afbd"/>
    <rect x="-6" y="104" width="53" height="56" rx="6" fill="#bcc3ce" stroke="#a6afbd"/>
    <circle cx="20" cy="160" r="12" fill="#8f98a8"/>
  </g>

  <!-- contact shadow -->
  <ellipse cx="210" cy="284" rx="170" ry="10" fill="#1d2433" opacity="0.10"/>

  <!-- car, seen from the front -->
  <g stroke="#9aa3b2" stroke-width="1.2" stroke-linejoin="round">
    <path d="M60 246Q60 184 92 162L118 150H303L329 162Q361 184 361 246V262Q361 280 343 280H78Q60 280 60 262Z" fill="#c3cad5"/>
    <path d="M118 150L142 84Q150 66 172 66H249Q271 66 279 84L303 150Z" fill="#cdd3dd"/>
    <path d="M132 146L152 92Q157 80 172 80H249Q264 80 269 92L289 146Z" fill="url(#glass)"/>
    <!-- lights, grille, bumper -->
    <rect x="84" y="176" width="48" height="20" rx="8" fill="#dfe4ec"/>
    <rect x="289" y="176" width="48" height="20" rx="8" fill="#dfe4ec"/>
    <rect x="168" y="172" width="85" height="34" rx="6" fill="#aab3c1"/>
    <path d="M174 183H247M174 194H247" stroke="#8d97a8" stroke-width="1.2"/>
    <path d="M72 250H349" stroke="#a6afbd" stroke-width="1"/>
    <!-- wheels -->
    <rect x="78" y="262" width="42" height="38" rx="8" fill="#7f8898" stroke="#6b7484"/>
    <rect x="301" y="262" width="42" height="38" rx="8" fill="#7f8898" stroke="#6b7484"/>
  </g>

  <!-- driver: abstract silhouette, no features -->
  <g fill="#8791a3">
    <circle cx="164" cy="103" r="12"/>
    <path d="M139 133Q141 117 164 115Q187 117 189 133Z"/>
  </g>

  <!-- licence plate: hatched placeholder, no characters -->
  <rect x="217" y="212" width="81" height="21" rx="3" fill="url(#hatch)" stroke="#7f8898" stroke-width="1.2"/>
</svg>
